[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-weather"
dynamic = ["version"]
description = "Weather station for jailbroken Kindle e-readers."
readme = "README.md"
requires-python = ">=3.8"
# Standard library only, so the package also runs on the Kindle. Drawing uses
# the system's cairo and FreeType libraries.
dependencies = []

[project.scripts]
kindle-weather = "kindle_weather.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kindle_weather.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kindle_weather = ["locales/*.json", "fonts/*", "icon_fonts/*", "kindle_extension/**/*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
