[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kindle-weather"
dynamic = ["version"]
description = "Weather station for jailbroken Kindle e-readers."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pillow>=10.4",
    "font-roboto==0.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kindle-weather = "kindle_weather.cli:main"

[tool.setuptools.dynamic]
version = { attr = "kindle_weather.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kindle_weather = ["locales/*.json", "icon_fonts/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
