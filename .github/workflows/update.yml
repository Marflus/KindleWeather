name: Mise à jour Kindle

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python et les librairies
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pillow

      - name: Générer l'image météo
        run: python generate_meteo.py

      - name: Connexion au réseau Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configurer la clé SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.KINDLE_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Envoyer et afficher l'image sur la Kindle
        run: |
          ssh -o StrictHostKeyChecking=no root@100.74.176.86 "mkdir -p /mnt/us/dashboard"
          scp -o StrictHostKeyChecking=no meteo.png root@100.74.176.86:/mnt/us/dashboard/
          ssh -o StrictHostKeyChecking=no root@100.74.176.86 "/usr/sbin/eips -f -g /mnt/us/dashboard/meteo.png && lipc-set-prop com.lab126.powerd flIntensity 0 && echo -n 0 > /sys/class/backlight/max77696-bl/brightness"
