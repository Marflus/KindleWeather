name: Update Kindle

on:
  schedule:
    # GitHub cron is UTC-only: one entry per UTC offset of TIMEZONE (summer, winter).
    - cron: "0 4 * * *"
    - cron: "0 5 * * *"
  workflow_dispatch:

env:
  TIMEZONE: Europe/Paris
  # Keep in sync with the wake window in kindle/extension/bin/watchdog.sh.
  TARGET_TIME: "06:00"

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          SCHEDULE: ${{ github.event.schedule }}
        # Scheduled runs are often delayed, so compare the cron expression that
        # fired (not the current time) with TARGET_TIME in TIMEZONE.
        run: |
          if [ -z "$SCHEDULE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          read -r minute hour _ <<< "$SCHEDULE"
          local_time=$(TZ="$TIMEZONE" date -d "$(date -u +%F) $hour:$minute UTC" +%H:%M)
          echo "Trigger '$SCHEDULE' is $local_time in $TIMEZONE"
          if [ "$local_time" = "$TARGET_TIME" ]; then run=true; else run=false; fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      - run: kindle-meteo render
      - uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Install SSH key
        env:
          KINDLE_SSH_KEY: ${{ secrets.KINDLE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$KINDLE_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
      # The Kindle re-enables Wi-Fi only every 5 minutes during its wake window.
      - run: kindle-meteo deploy --wait 180
