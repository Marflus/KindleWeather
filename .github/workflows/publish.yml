name: Publish dashboard

on:
  schedule:
    # Hourly, off the top of the hour when GitHub's scheduler is busiest.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}dashboard.png
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install .
      # Without weather data, render still writes an error screen (E1) and
      # fails; publish it anyway so the Kindle shows the error.
      - run: kindle-weather render --output site/dashboard.png
      - id: upload
        if: ${{ !cancelled() && hashFiles('site/dashboard.png') != '' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        uses: actions/deploy-pages@v4
