name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.9: the oldest Python the Kindle may run.
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      # Drawing uses the system's cairo and FreeType, as on the Kindle.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libcairo2 libfreetype6
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest
      - run: python scripts/package.py

  kindle-scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck --shell=sh --severity=warning src/kindle_weather/kindle_extension/bin/*.sh
